server.port=0

# ===== 本地集群作业调度器配置 =====
# 心跳超时阈值（毫秒）：工作进程超过该时长未心跳即判定丢失
scheduler.heartbeat-timeout-millis=5000
# 后台巡检周期（毫秒）：<=0 关闭后台巡检（测试中通常手动 POST /api/scheduler/tick）
scheduler.tick-interval-millis=1000
# 丢失后重试的退避时间（毫秒）
scheduler.retry-backoff-millis=0
# 默认最大重试次数（attemptCount > maxRetries 时终止为 FAILED）
scheduler.default-max-retries=2
# 排队作业每等待该毫秒数获得 1 级优先级提升（防饥饿）
scheduler.starvation-boost-millis=10000
# 老化提升上限
scheduler.max-boost=1000000
# 本地追加式事件日志路径（进程重启后据此恢复）
scheduler.event-log-path=data/scheduler-events.log
# 仅当事件日志为空时播种演示节点
scheduler.seed-demo-nodes=true
