server.port=0

# ===== 本地集群作业调度器配置（无真实集群/外部服务/凭据） =====
# 本地 JSON 快照，进程重启后据此恢复；置空则纯内存
scheduler.snapshot-file=data/scheduler-snapshot.json
# 工作进程心跳超时（毫秒）
scheduler.heartbeat-timeout-ms=15000
# 节点心跳超时（毫秒）
scheduler.node-timeout-ms=20000
# 后台巡检周期
scheduler.tick-interval-ms=2000
# 排队等待每经过该毫秒，有效优先级 +1（防饥饿）
scheduler.aging-boost-per-ms=5000
# 默认重试次数与退避
scheduler.default-max-retries=2
scheduler.default-backoff-ms=1000
# 后台巡检开关
scheduler.tick-enabled=true
# 启动时是否注册演示节点（node-a/b/c）
scheduler.demo-cluster=false
